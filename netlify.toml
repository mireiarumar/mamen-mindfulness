[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: todas las rutas internas se sirven desde index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker debe servirse desde la raíz sin caché agresiva
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
